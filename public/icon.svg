<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4338ca" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner ambient card -->
  <g filter="url(#dropGlow)">
    <rect x="76" y="80" width="360" height="230" rx="28" fill="url(#cardGrad)" />
    <!-- Chip / Contact icon badge -->
    <rect x="110" y="116" width="48" height="38" rx="8" fill="#fbbf24" opacity="0.9" />
    <line x1="110" y1="135" x2="158" y2="135" stroke="#b45309" stroke-width="2" />
    <line x1="134" y1="116" x2="134" y2="154" stroke="#b45309" stroke-width="2" />

    <!-- Name & title lines -->
    <rect x="180" y="122" width="160" height="12" rx="6" fill="#ffffff" />
    <rect x="180" y="142" width="110" height="8" rx="4" fill="#c7d2fe" />

    <!-- Contact avatar circle -->
    <circle cx="380" cy="135" r="22" fill="#ffffff" opacity="0.25" />
    <circle cx="380" cy="128" r="8" fill="#ffffff" />
    <path d="M366 148 C366 140 372 138 380 138 C388 138 394 140 394 148 Z" fill="#ffffff" />

    <!-- Wave pattern lines on card -->
    <path d="M110 240 C190 210, 290 270, 390 230" stroke="#a5b4fc" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.4" />
    <path d="M110 260 C200 235, 280 285, 390 250" stroke="#a5b4fc" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.3" />
  </g>

  <!-- Dynamic QR Matrix Badge / Scanner -->
  <g filter="url(#dropGlow)">
    <rect x="126" y="240" width="260" height="200" rx="24" fill="#ffffff" />
    
    <!-- QR Corner 1 -->
    <rect x="156" y="270" width="46" height="46" rx="8" fill="#1e1b4b" />
    <rect x="166" y="280" width="26" height="26" rx="4" fill="#ffffff" />
    <rect x="173" y="287" width="12" height="12" rx="2" fill="#4f46e5" />

    <!-- QR Corner 2 -->
    <rect x="310" y="270" width="46" height="46" rx="8" fill="#1e1b4b" />
    <rect x="320" y="280" width="26" height="26" rx="4" fill="#ffffff" />
    <rect x="327" y="287" width="12" height="12" rx="2" fill="#4f46e5" />

    <!-- QR Corner 3 -->
    <rect x="156" y="364" width="46" height="46" rx="8" fill="#1e1b4b" />
    <rect x="166" y="374" width="26" height="26" rx="4" fill="#ffffff" />
    <rect x="173" y="381" width="12" height="12" rx="2" fill="#4f46e5" />

    <!-- Data matrix dots -->
    <rect x="232" y="272" width="12" height="12" rx="2" fill="#4338ca" />
    <rect x="254" y="272" width="12" height="12" rx="2" fill="#6366f1" />
    <rect x="276" y="272" width="12" height="12" rx="2" fill="#1e1b4b" />
    
    <rect x="232" y="294" width="12" height="12" rx="2" fill="#1e1b4b" />
    <rect x="254" y="294" width="34" height="12" rx="2" fill="#4f46e5" />

    <rect x="232" y="316" width="34" height="12" rx="2" fill="#6366f1" />
    <rect x="276" y="316" width="12" height="12" rx="2" fill="#1e1b4b" />
    <rect x="310" y="326" width="12" height="12" rx="2" fill="#4338ca" />
    <rect x="332" y="326" width="24" height="12" rx="2" fill="#6366f1" />

    <rect x="232" y="348" width="12" height="34" rx="2" fill="#1e1b4b" />
    <rect x="254" y="348" width="24" height="12" rx="2" fill="#4f46e5" />
    <rect x="288" y="348" width="22" height="22" rx="3" fill="#38bdf8" />
    <rect x="320" y="358" width="36" height="12" rx="2" fill="#4338ca" />

    <rect x="232" y="392" width="34" height="18" rx="2" fill="#6366f1" />
    <rect x="276" y="380" width="12" height="30" rx="2" fill="#1e1b4b" />
    <rect x="298" y="380" width="22" height="30" rx="3" fill="#4f46e5" />
    <rect x="330" y="380" width="26" height="30" rx="3" fill="#6366f1" />

    <!-- Pulse scanner beam indicator -->
    <line x1="140" y1="338" x2="372" y2="338" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
